[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "seldon"
version = "0.1.0"
description = "Provider-normal planning, execution and evidence workflow."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
seldon = "codex_harness.core.seldon_cli:main"
seldon-mcp = "codex_harness.core.seldon_cli:mcp_main"
p = "codex_harness.core.plan_cli:main"
plan_cli = "codex_harness.core.plan_cli:main"
run_plan = "codex_harness.core.dispatch_cli:main"
status_server = "codex_harness.core.status_server:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.11.13"]

[tool.hatch.build.targets.wheel]
packages = ["src/codex_harness"]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = ["tests/python/core"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
