[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "seldon"
version = "0.1.0"
description = "Provider-normal planning, execution and evidence workflow."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.11.13"]

[tool.hatch.build.targets.wheel]
packages = ["src/seldon"]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = ["tests/seldon"]
markers = ["fast: shared golden and approval journeys; gate ceiling is ten minutes"]

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["src", "tests/seldon"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
