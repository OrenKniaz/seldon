name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  journeys:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        shell: bash
        run: python -m pip install -q . pytest==8.4.2 pytest-xdist
      - name: Behaviour journeys
        shell: bash
        env:
          GATE_ROOT: ${{ runner.temp }}/gate
          GATE_WORKERS: "4"
        run: bash scripts/gate.sh ci
