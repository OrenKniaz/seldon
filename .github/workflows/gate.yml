name: gate
# Hermetic behaviour journeys. The full gate (with recorded runs and browser checks) runs locally.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  journeys:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        shell: bash
        run: python -m pip install -q . pytest==8.4.2 pytest-xdist
      - name: Behaviour journeys
        shell: bash
        env:
          GATE_ROOT: ${{ runner.temp }}/gate
          GATE_WORKERS: "4"
        # Journeys that replay recorded local runs or need Node + Playwright run on the dev machine only.
        run: >
          bash scripts/gate.sh ci
          -k "not size_guide_journey and not size_proof_journey and not browser_kit
          and not recorded_code_shape and not recorded_runtime_evidence and not check_kit_golden"

