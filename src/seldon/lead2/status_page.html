<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seldon · Planner status</title>
<style>
:root{--ink:#243b32;--muted:#5e6a61;--paper:#f7f8f3;--line:#dfe4da;--green:#286246;--soft:#edf3e8;
--q:#846018;--planned:#56697b;--building:#285db0;--review:#8a5a00;--fix:#a43d36;--passed:#21756e;--accepted:#174c35;--glow:#e8b23a}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 'DM Sans',system-ui,sans-serif}
h1{font:400 32px/1.15 Georgia,serif;margin:0}h2{font-size:15px;margin:0 0 10px}small,.muted{color:var(--muted)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 26px;border-bottom:1px solid var(--line);background:#fff}
.brand{display:flex;gap:9px;align-items:center;font-weight:600;font-size:18px}.mark{width:26px;height:28px;border-radius:8px 8px 12px 8px;background:var(--green);color:#fff;display:grid;place-items:center;font-family:Georgia}
.now{display:flex;align-items:center;gap:10px;font-size:13px}.pulse{width:10px;height:10px;border-radius:50%;background:var(--glow);box-shadow:0 0 0 0 #e8b23a99;animation:p 1.6s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 #e8b23a99}70%{box-shadow:0 0 0 10px #e8b23a00}100%{box-shadow:0 0 0 0 #e8b23a00}}
main{padding:22px 26px;max-width:1300px;margin:auto}
section{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px}
/* loop strip */
.loop{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:6px 2px 4px}
.stage{min-width:96px;flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fbfcf8;position:relative;transition:.4s}
.arrow{align-self:center;color:#9fb094;padding:0 6px;font-size:18px}
.stage b{display:block;font-size:12px}.stage small{display:block;font-size:10px;margin-top:3px}
.stage .loopmark{position:absolute;top:6px;right:8px;font-size:11px;color:var(--muted)}
.stage.done{background:var(--soft);border-color:#b9cdb0}.stage.done b:before{content:"✓ ";color:var(--green)}
.stage.current{border-color:var(--glow);background:#fffaf0;box-shadow:0 0 0 3px #e8b23a33,0 0 22px #e8b23a55}
.stage.current .act{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:10px;color:#7a5500;background:#fdf1d8;border-radius:4px;padding:2px 6px}
.stage .act{display:none}
/* trace */
.cols{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:6px}
.trace{position:relative}.row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:10px;align-items:center}
.node{border:1px solid var(--line);border-left:3px solid var(--st,var(--planned));border-radius:8px;padding:8px 10px;background:#fff;font-size:12px;min-height:46px;transition:.5s}
.node .tag{display:inline-block;margin-top:4px;font-size:9.5px;padding:1px 6px;border-radius:4px;background:#f0f2ec;color:var(--st,var(--muted))}
.node.empty{border:1px dashed var(--line);background:transparent;color:var(--muted)}
.s-planned{--st:var(--planned)}.s-building{--st:var(--building)}.s-review{--st:var(--review)}.s-fix{--st:var(--fix);background:#fff7f5}
.s-passed{--st:var(--passed)}.s-accepted{--st:var(--accepted)}
.s-passed,.s-accepted{box-shadow:0 0 0 2px #e8b23a40,0 0 16px #e8b23a66;border-color:#e3c27a}
.vision{align-self:stretch;display:flex;flex-direction:column;justify-content:center;border:1px solid #bdcbb6;border-radius:11px;padding:14px;background:#fff}
.idea-title{font:400 22px/1.1 Georgia,serif;margin:6px 0}
svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}.row,.vision{position:relative;z-index:1}
svg.lines path{fill:none;stroke:#c3d0ba;stroke-width:1.4}svg.lines path.lit{stroke:#e2a92b;stroke-width:2.2;filter:drop-shadow(0 0 4px #e8b23a)}
svg.lines path.bad{stroke:var(--fix);stroke-width:2}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:10px;color:var(--muted);margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.replay{display:flex;align-items:center;gap:14px}.replay input{flex:1;accent-color:var(--green)}
.replay button{border:0;background:var(--green);color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer}
.story{font-size:12px;color:var(--muted);margin-top:8px;min-height:18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.cols,.row{grid-template-columns:repeat(5,minmax(0,1fr))}
.cols{margin-left:calc((100% + 10px) / 6)}
.trace{min-height:80px}
.trace-wrap{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.trace-wrap .trace{grid-column:span 5}
.vision{justify-content:start}
.stage b{padding-right:8px}
.story:empty{display:none}
.node,.vision{font-family:inherit;color:inherit;text-align:left}
.node{overflow-wrap:anywhere;align-self:stretch}
.node:not(.empty),button.vision{cursor:pointer}
.node:not(.empty):hover,.vision:hover{border-color:var(--green);background:var(--soft)}
.node:focus-visible,.vision:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.node .label{display:block;font-weight:600}
.node .cell-label{display:none}
.vision{align-self:start;width:100%;min-width:0}
#idea{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feature-group + .feature-group{border-top:1px solid var(--line);padding-top:10px}
dialog{width:min(440px,calc(100% - 24px));max-height:70dvh;overflow:auto;padding:16px;
       border:1px solid var(--line);border-radius:12px;color:var(--ink)}
dialog::backdrop{background:#243b3260}
dialog form{display:flex;justify-content:space-between;align-items:start;gap:8px}
dialog button{border:1px solid var(--line);border-radius:6px;background:var(--soft);padding:4px 10px;
              color:inherit;cursor:pointer}
#inspectorBody p{white-space:pre-wrap;overflow-wrap:anywhere}
#inspectorBody ul{padding-left:20px}
.replay input{min-width:0}
.replay button{flex:none}
.replay{position:sticky;bottom:8px;z-index:2}
#live{border-radius:6px;width:auto;padding:0 12px}
.pulse{flex:none}
@media(max-width:760px){
  header{padding:12px 14px;gap:12px}
  main{padding:12px}
  section{padding:12px}
  .stage{min-width:118px}
  .cols{display:none}
  .trace-wrap{display:block}
  .trace{margin-top:12px}
  .row{grid-template-columns:1fr 1fr;align-items:stretch;padding-bottom:10px;
       border-bottom:1px solid var(--line)}
  .node:first-child{grid-column:1/-1}
  .node .cell-label{display:block;margin-bottom:4px}
  svg.lines{display:none}
}
</style></head><body>
<header><div class="brand"><div class="mark">S</div>seldon</div>
<div class="now"><span class="pulse" aria-hidden="true"></span><span id="nowText" role="status">Loading…</span></div></header>
<main>
<section>
  <h2>Where Seldon is</h2>
  <div class="loop" id="loop"></div>
  <div class="story" id="story"></div>
</section>
<section>
  <h2>The trace</h2>
  <div class="cols" aria-hidden="true"><div>Features</div><div>User stories</div><div>Checks &amp; walks</div><div>Code chunk</div><div>Review / judge</div></div>
  <div class="trace-wrap">
    <button type="button" class="vision" id="ideaCell"><small>YOUR IDEA</small>
      <span id="idea" class="idea-title"></span><small id="owner"></small></button>
    <div class="trace" id="trace"></div>
    <svg class="lines" id="lines" aria-hidden="true"></svg>
  </div>
</section>
<section class="replay" aria-label="Replay">
  <button type="button" id="play" aria-label="Play replay">▶</button>
  <input type="range" id="t" min="0" max="0" value="0" aria-label="Replay position">
  <small id="tlabel"></small>
  <button type="button" id="live">Live</button>
</section>
</main>
<dialog id="inspector" aria-labelledby="inspectorTitle">
  <form method="dialog"><h2 id="inspectorTitle"></h2><button autofocus>Close</button></form>
  <div id="inspectorBody"></div>
</dialog>
<script>
const STAGES = [
  ["Your idea"], ["Align the idea", "rounds", true], ["Agree the stack", "rounds", true],
  ["Write the plan"], ["Review & fix", "up to 3", true], ["You approve"],
  ["Build", "chunk by chunk", true], ["Judge walks it", "until all pass", true], ["Your OK"]
];
const LABELS = ["Feature", "User stories", "Checks & walks", "Code chunk", "Review / judge"];
const STATUS = {
  planned: ["planned", "Planned"],
  built: ["building", "Built"],
  "proven-current": ["passed", "Passed"],
  failed: ["fix", "Failed"],
  stale: ["planned", "Needs a new check"],
  "not-verifiable-here": ["review", "Can’t test here"],
  "changed-by-person": ["planned", "Changed by you"]
};
const byId = id => document.getElementById(id);
const loop = byId("loop"), trace = byId("trace"), timeline = byId("t"), lines = byId("lines");
let data, following = true, timer, shown, shownTrace, reachable = true;

function element(tag, text, css) {
  const node = document.createElement(tag);
  if (text) node.textContent = text;
  if (css) node.className = css;
  return node;
}

function drawLines() {
  if (window.innerWidth <= 760) return;
  lines.replaceChildren();
  const bounds = lines.getBoundingClientRect();
  const middle = node => {
    const box = node.getBoundingClientRect();
    return [box.left - bounds.left, box.right - bounds.left, box.top - bounds.top + box.height / 2];
  };
  const vision = document.querySelector(".vision");
  for (const row of trace.querySelectorAll(".row")) {
    let from = vision;
    for (const to of row.children) {
      const [, x1, y1] = middle(from), [x2, , y2] = middle(to);
      const center = (x1 + x2) / 2;
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", `M${x1},${y1} C${center},${y1} ${center},${y2} ${x2},${y2}`);
      if (row.dataset.line) path.setAttribute("class", row.dataset.line);
      lines.append(path);
      from = to;
    }
  }
}

function showStages(frame) {
  loop.replaceChildren();
  STAGES.forEach(([name, hint, repeat], index) => {
    if (index) loop.append(element("span", "→", "arrow"));
    const selected = index === frame.stage;
    const done = (index < frame.stage && data.frames.slice(0, +timeline.value).some(f => f.stage === index))
      || (selected && frame.approved);
    const stage = element("div", "", "stage" + (done ? " done" : "") + (selected ? " current" : ""));
    if (selected) stage.setAttribute("aria-current", "step");
    if (repeat) stage.append(element("span", "↻", "loopmark"));
    stage.append(element("b", name));
    const sub = index === 1 && frame.stage >= 1 ? `Round ${frame.rounds}` :
      index === 4 && frame.reviews ? `${frame.reviews} of 3` : hint;
    if (sub) stage.append(element("small", sub));
    if (selected) stage.append(element("span", frame.activity, "act"));
    loop.append(stage);
  });
  if (frame.stage !== shown) {
    const current = loop.querySelector(".current");
    loop.scrollLeft = current.offsetLeft - loop.offsetLeft - 8;
    shown = frame.stage;
  }
}

function inspect(heading, entries) {
  byId("inspectorTitle").textContent = heading;
  const body = byId("inspectorBody");
  if (entries.length === 1) {
    body.replaceChildren(element("p", entries[0].text));
  } else {
    const list = element("ul");
    for (const entry of entries) {
      const item = element("li");
      item.append(element("strong", entry.label), element("p", entry.text));
      list.append(item);
    }
    body.replaceChildren(list);
  }
  byId("inspector").showModal();
}

const count = (items, noun, plural = noun + "s") =>
  items.length ? `${items.length} ${items.length === 1 ? noun : plural}` : "";

function traceCell(values, category, style, label) {
  const cell = element(values.length ? "button" : "div", "", "node s-" + style + (values.length ? "" : " empty"));
  cell.append(element("small", category, "cell-label"), element("span", label || "—", "label"));
  if (values.length) {
    cell.type = "button";
    cell.setAttribute("aria-label", `${category}: ${label}`);
    cell.onclick = () => inspect(values.length === 1 ? values[0].label : category, values);
  }
  return cell;
}

function showTrace(rows) {
  const signature = JSON.stringify(rows);
  if (signature === shownTrace) return;
  shownTrace = signature;
  trace.replaceChildren();
  if (!rows.length) trace.append(element("p", "Promises will appear as the plan takes shape.", "muted"));
  const groups = new Map();
  for (const item of rows) {
    if (!groups.has(item.group)) {
      const group = element("div", "", "feature-group");
      group.setAttribute("role", "group");
      group.setAttribute("aria-label", item.stories[0]?.label || "Other features");
      groups.set(item.group, group);
      trace.append(group);
    }
    const row = element("div", "", "row");
    const [style, label] = STATUS[item.status];
    row.dataset.line = style === "passed" ? "lit" : style === "fix" ? "bad" : "";
    const proof = [...item.checks, ...item.walks];
    const proofLabel = [count(item.checks, "check"), count(item.walks, "walk")].filter(Boolean).join(" · ");
    const cells = [[item.feature], item.stories, proof, item.modules, [{label, text:label}]];
    const summaries = ["", count(item.stories, "story", "stories"), proofLabel,
      count(item.modules, "module"), label];
    cells.forEach((values, i) => row.append(traceCell(values, LABELS[i], style,
      values.length === 1 ? values[0].label : summaries[i])));
    groups.get(item.group).append(row);
  }
  requestAnimationFrame(drawLines);
}

function render() {
  if (!data) return;
  const index = +timeline.value, frame = data.frames[index];
  byId("nowText").textContent = reachable ? frame.activity : "Live status unavailable";
  byId("story").textContent = frame.detail;
  byId("idea").textContent = data.idea.label;
  byId("owner").textContent = data.idea.owner;
  byId("tlabel").textContent = `${index + 1} / ${data.frames.length} · ${following ? "Live" : "Replay"}`;
  byId("live").disabled = following;
  showStages(frame);
  showTrace(data.trace[frame.revision]);
}

function stopReplay() {
  clearInterval(timer);
  timer = undefined;
  byId("play").textContent = "▶";
  byId("play").setAttribute("aria-label", "Play replay");
}

timeline.oninput = () => { stopReplay(); following = false; render(); };
byId("live").onclick = () => {
  stopReplay();
  following = true;
  timeline.value = timeline.max;
  render();
};
byId("play").onclick = () => {
  if (!data) return;
  if (timer) { stopReplay(); return; }
  following = false;
  if (timeline.value === timeline.max) timeline.value = 0;
  byId("play").textContent = "Ⅱ";
  byId("play").setAttribute("aria-label", "Pause replay");
  render();
  timer = setInterval(() => {
    timeline.value = +timeline.value + 1;
    render();
    if (timeline.value === timeline.max) stopReplay();
  }, 1600);
};

async function poll() {
  try {
    const response = await fetch("state.json");
    if (!response.ok) throw new Error(response.status);
    const next = await response.json();
    if (reachable && JSON.stringify(next) === JSON.stringify(data)) return;
    reachable = true;
    data = next;
    timeline.max = data.frames.length - 1;
    if (following) timeline.value = timeline.max;
    render();
  } catch {
    reachable = false;
    byId("nowText").textContent = "Live status unavailable";
  } finally {
    setTimeout(poll, 2000);
  }
}
window.addEventListener("resize", drawLines);
byId("ideaCell").onclick = () => { if (data) inspect(data.idea.label, [data.idea]); };
poll();
</script></body></html>
