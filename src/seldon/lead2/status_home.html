<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seldon · Plans</title>
<!-- theme script -->
<style>
:root{--ink:#243b32;--muted:#5e6a61;--paper:#f7f8f3;--card:#fff;--line:#dfe4da;--green:#286246;--soft:#edf3e8;--glow:#e8b23a;--glowbg:#fffaf0;--red:#a43d36}
:root[data-theme=dark]{--ink:#e9eee6;--muted:#a2ada3;--paper:#0f1a17;--card:#16231f;--line:#2a3a34;--green:#6fbf8f;--soft:#1d3029;--glow:#f0bf4c;--glowbg:#2a2412;--red:#e0796f}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 'DM Sans',system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--card)}
.brand{display:flex;gap:9px;align-items:center;font-weight:600;font-size:18px}.mark{width:26px;height:28px;border-radius:8px 8px 12px 8px;background:var(--green);color:#fff;display:grid;place-items:center;font-family:Georgia}
.hright{display:flex;align-items:center;gap:14px;font-size:12px}.need{display:inline-flex;align-items:center;gap:7px;border:1px solid #d9b866;background:var(--glowbg);color:#7a5500;padding:4px 10px;border-radius:20px}
:root[data-theme=dark] .need{color:var(--glow)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--glow);animation:p 1.6s infinite}@keyframes p{0%{box-shadow:0 0 0 0 #e8b23a99}70%{box-shadow:0 0 0 9px #e8b23a00}100%{box-shadow:0 0 0 0 #e8b23a00}}
.theme{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:20px;padding:4px 10px;cursor:pointer;font:inherit}
main{max-width:1180px;margin:auto;padding:30px 28px 60px}
h1{font:400 36px/1.1 Georgia,serif;margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin-bottom:26px}
h2{font:600 11px/1.5 Georgia,serif;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin:26px 0 12px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;list-style:none;margin:0;padding:0}
.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;height:100%;padding:18px 18px 14px;transition:.2s;position:relative}
a.card:hover{transform:translateY(-1px);box-shadow:0 8px 24px #24403312;border-color:#b9cdb0}
a.card:focus-visible{outline:3px solid #285db0;outline-offset:3px}
.card.waiting{border-color:#e3c27a;box-shadow:0 0 0 3px #e8b23a22,0 0 22px #e8b23a33}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.title{font:400 22px/1.15 Georgia,serif;margin:0;overflow-wrap:anywhere;min-width:0}
.idea{font-size:12.5px;color:var(--muted);margin:5px 0 0;min-height:38px;
      display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.chip{flex-shrink:0;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--soft);color:var(--green);display:inline-flex;align-items:center;gap:6px}
.chip.wait{background:var(--glowbg);color:#7a5500}:root[data-theme=dark] .chip.wait{color:var(--glow)}
.chip.build{background:#e6eefb;color:#285db0}:root[data-theme=dark] .chip.build{background:#1b2840;color:#8fb3ef}
.chip.stop{background:#eef0ea;color:var(--muted)}:root[data-theme=dark] .chip.stop{background:#22302b}
.chip.fix{background:#fbeceb;color:var(--red)}:root[data-theme=dark] .chip.fix{background:#3a1f1d}
.strip{display:flex;gap:3px;margin:14px 0 6px}.seg{flex:1;height:6px;border-radius:3px;background:var(--line)}
.seg.done{background:var(--green)}.seg.cur{background:var(--glow);box-shadow:0 0 8px var(--glow)}
.seg.bad{background:var(--red)}
.stage{font-size:11.5px;display:flex;justify-content:space-between;color:var(--muted)}.stage b{color:var(--ink);font-weight:600}
.owner{font-size:11px;color:var(--muted);margin-top:10px;border-top:1px solid var(--line);padding-top:9px;display:flex;justify-content:space-between}
.more{margin-top:16px;text-align:center}.more a{display:inline-block;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}
@media (max-width:560px){main{padding:20px 16px}header{padding:12px 16px}.grid{grid-template-columns:1fr}h1{font-size:30px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.chip .pulse{width:6px;height:6px;flex:none}
.need{white-space:nowrap}.need.quiet{border-color:var(--line);background:transparent;color:var(--muted)}
.quiet,.empty p{color:var(--muted)}
.owner{gap:8px;overflow-wrap:anywhere}.owner time{white-space:nowrap}
.more a + a{margin-left:8px}
</style></head><body>
<header>
  <div class="brand"><span class="mark" aria-hidden="true">S</span>seldon</div>
  <div class="hright">
    $waiting
    <button type="button" class="theme" id="theme">Dark</button>
  </div>
</header>
<main>
  <h1>Your plans</h1>
  <div class="sub">Every dream Seldon is shaping, building or has delivered. Click one to see where it stands.</div>
  $content
</main>
</body></html>
