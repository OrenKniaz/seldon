<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seldon · The walk</title>
<style>
:root{--ink:#243b32;--muted:#5e6a61;--paper:#f7f8f3;--card:#fff;--line:#dfe4da;--green:#286246;--soft:#edf3e8;--glow:#e8b23a;--glowbg:#fffaf0;--red:#a43d36;--redbg:#fff6f4;--amber:#8a5a00;--ambbg:#fdf3dc;--shot:#e9ede4}
:root[data-theme=dark]{--ink:#e9eee6;--muted:#a2ada3;--paper:#0f1a17;--card:#16231f;--line:#2a3a34;--green:#6fbf8f;--soft:#1d3029;--glow:#f0bf4c;--glowbg:#2a2412;--red:#e0796f;--redbg:#2b1a18;--amber:#e6b85c;--ambbg:#2e2614;--shot:#1d2b26}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 'DM Sans',system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 26px;border-bottom:1px solid var(--line);background:var(--card)}
.brand{display:flex;gap:9px;align-items:center;font-weight:600;font-size:18px}.mark{width:26px;height:28px;border-radius:8px 8px 12px 8px;background:var(--green);color:#fff;display:grid;place-items:center;font-family:Georgia}
a{color:var(--green)}.theme{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:20px;padding:4px 10px;cursor:pointer;font:inherit;font-size:12px}
main{max-width:1160px;margin:auto;padding:24px 26px 60px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:20px}.tabs a{padding:10px 0;text-decoration:none;color:var(--muted);font-size:13px}.tabs a.on{color:var(--green);border-bottom:2px solid var(--green);font-weight:600}
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:18px}
.hero h1{font:400 30px/1.15 Georgia,serif;margin:0}.hero p{margin:6px 0 0;color:var(--muted);font-size:13px}
.score{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.pill{font-size:12px;font-weight:600;padding:4px 11px;border-radius:20px}
.pill.ok{background:var(--soft);color:var(--green)}.pill.bad{background:var(--redbg);color:var(--red)}.pill.cant{background:var(--ambbg);color:var(--amber)}
.open form,.open .btn{width:100%}.open{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:230px}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;background:var(--green);color:#fff;border:0;border-radius:9px;padding:11px 16px;font:600 14px 'DM Sans',sans-serif;cursor:pointer;text-decoration:none;box-shadow:0 0 0 3px #e8b23a33,0 0 18px #e8b23a44}
:root[data-theme=dark] .btn{background:#2f6e4f}
.btn2{text-align:center;font-size:12px}
.story{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.story.pass{border-color:#e3c27a;box-shadow:0 0 0 2px #e8b23a30,0 0 16px #e8b23a40}
.story.fail{border-color:#d9a39d}
.shead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;cursor:pointer}
.shead>.verdict{flex-shrink:0}.shead h2{font:400 19px/1.2 Georgia,serif;margin:0}.shead small{color:var(--muted);display:block;margin-top:2px;font-size:12px}
.roles{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.role{font-size:10.5px;border:1px solid var(--line);border-radius:12px;padding:1px 8px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;padding:0 18px 16px}
.step{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.shot{min-height:118px;background:var(--shot);display:flex;justify-content:center;align-items:center;gap:6px;padding:6px;color:var(--muted);font-size:11px;position:relative}
.shot a{display:grid;justify-items:center;flex:1;min-width:0}.shot img{width:100%;height:auto;max-height:320px;object-fit:contain;display:block}.step:has(.desktop-view){grid-column:span 2}.guide{scroll-margin-top:12px}.guide summary{cursor:pointer;font-weight:600;color:var(--green)}.guide h3{color:var(--ink)}.guide li{margin-bottom:6px}.verification b{color:var(--red)}.guide pre{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}.shead{cursor:default}.stepbody,.hero{overflow-wrap:anywhere}
.stepbody{padding:9px 11px}.stepbody b{font-size:12.5px;display:block}
.stepbody .who{font-size:10.5px;color:var(--muted)}
.ea{font-size:11.5px;margin-top:6px}.ea span{display:block}.ea .exp{color:var(--muted)}
.verdict{font-size:10.5px;font-weight:700;margin-top:6px;display:inline-block;padding:1px 7px;border-radius:4px}
.v-ok{background:var(--soft);color:var(--green)}.v-bad{background:var(--redbg);color:var(--red)}.v-cant{background:var(--ambbg);color:var(--amber)}
.step.bad{border-color:#d9a39d}.step.bad .shot{outline:2px solid var(--red);outline-offset:-2px}
.ux{margin:0 18px 16px;padding:10px 12px;border-radius:9px;background:var(--glowbg);font-size:12.5px;border:1px solid #ecd9a8}
:root[data-theme=dark] .ux{border-color:#4a3d1c}
.ux b{color:var(--amber)}
.fix{margin:0 18px 16px;padding:10px 12px;border-radius:9px;background:var(--redbg);font-size:12.5px;color:var(--red)}
.limits{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:14px 18px;margin-top:18px;font-size:12.5px;color:var(--muted)}
.limits b{color:var(--ink)}
@media (max-width:640px){.step:has(.desktop-view){grid-column:auto}.hero{grid-template-columns:1fr}.open{min-width:0}main{padding:18px 16px}header{padding:12px 16px}}
</style></head><body>
<header><div class="brand"><a href="../" style="color:inherit;text-decoration:none;display:flex;gap:9px;align-items:center"><div class="mark">S</div>seldon</a><a href="../" style="font-weight:400;font-size:12px;margin-left:14px">← All plans</a><small style="font-weight:400;margin-left:14px;color:var(--muted)"><!-- walk identity --></small></div><button class="theme" id="theme">Dark</button></header>
<main>
<nav class="tabs" aria-label="Plan views"><a href="./">Where Seldon is</a><a class="on" href="walk" aria-current="page">The walk</a></nav>
<!-- walk content -->
</main>
<!-- theme script -->
</body></html>
